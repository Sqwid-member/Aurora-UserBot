name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . || true)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1 -race -timeout 5m

  cross:
    name: cross-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: arm64, label: Termux arm64 }
          - { goos: linux,   goarch: arm,   label: Termux armv7 }
          - { goos: android, goarch: arm64, label: Android arm64 }
          - { goos: linux,   goarch: amd64, label: linux/amd64 }
          - { goos: darwin,  goarch: arm64, label: macOS arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: build ${{ matrix.label }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o "aurora-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/aurora
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-${{ matrix.goarch }}
          path: aurora-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  size:
    name: binary size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o aurora ./cmd/aurora
      - name: report
        run: |
          ls -lh aurora
          echo "### Бінарник Aurora — $(du -h aurora | cut -f1)" >> $GITHUB_STEP_SUMMARY
