name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          PKG: github.com/Sqwid-member/Aurora-UserBot/internal/buildinfo
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LDF="-s -w -X ${PKG}.Version=${TAG} -X ${PKG}.Commit=${SHA}"
          for p in android/arm64 linux/arm64 linux/arm linux/amd64 darwin/arm64 darwin/amd64; do
            os="${p%/*}"
            arch="${p#*/}"
            out="dist/aurora-${os}-${arch}"
            echo "build ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$LDF" -o "$out" ./cmd/aurora
            case "${os}/${arch}" in
              android/arm64|linux/arm64|linux/arm)
                tar -C dist -czf "${out}.tar.gz" "$out"
                rm -f "$out"
                ;;
            esac
          done
          ls -lh dist/

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --title "Aurora $TAG" \
            --generate-notes \
            || gh release upload "$TAG" dist/* --clobber
