name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: resolve version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: sanity: gofmt + vet
        run: |
          test -z "$(gofmt -l .)" || { echo "::error::not gofmt clean"; gofmt -l .; exit 1; }
          go vet ./...

      - name: build matrix
        run: |
          set -euo pipefail
          mkdir -p dist
          for pair in android/arm64 linux/arm64 linux/arm linux/amd64 darwin/arm64 darwin/amd64; do
            os="${pair%/*}"; arch="${pair#*/}"
            out="dist/aurora-${os}-${arch}"
            echo "::group::${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w \
                  -X github.com/Sqwid-member/Aurora-UserBot/internal/buildinfo.Version=${GITHUB_REF_NAME} \
                  -X github.com/Sqwid-member/Aurora-UserBot/internal/buildinfo.Commit=${GITHUB_SHA} \
                  -X github.com/Sqwid-member/Aurora-UserBot/internal/buildinfo.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                -o "$out" ./cmd/aurora
            # Termux wants a bare name; zip the rest so the download is a file.
            case "$os/$arch" in
              android/arm64|linux/arm64|linux/arm)
                tar -C dist -czf "$out.tar.gz" "$out"
                rm -f "$out"
                ;;
            esac
            echo "::endgroup::"
          done
          ls -lh dist/

      - name: build example plugin (Go)
        run: |
          cd plugins/hello
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o ../dist/aurora-plugin-hello .

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Aurora ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
          generate_release_notes: true
          files: |
            dist/*
